name: CI

# Nothing else validates a branch: vercel.json restricts deployments to
# `deploy-vercel`, so without this workflow the first thing that ever runs
# lint, tests or a build on a change is the production deploy itself.
on:
  pull_request:
  push:
    branches: [main, develop, deploy-vercel]
  workflow_dispatch:

# A force-push or a quick follow-up commit makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

# The four checks run as separate jobs rather than as steps of one, so wall
# time is the slowest of them instead of their sum. Each pays its own
# `npm ci`, but the npm cache keeps that cheap and this repository is
# public, so runner minutes are free.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # tsconfig.ci.json narrows this to production source - see the comment
      # in that file for why specs are left to jest.
      - run: npx tsc --noEmit -p tsconfig.ci.json

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Restore Jest transform cache
        # Without this every run re-transforms the whole tree through SWC
        # before a single test executes. Jest hashes each file and discards
        # anything stale, so a partially outdated cache is still a win.
        uses: actions/cache@v6
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            jest-${{ runner.os }}-

      - name: Test
        # Coverage stays on: jest.config.mjs enforces a floor, and dropping
        # it here would mean the thresholds never actually run.
        run: npm test -- --ci --cacheDirectory=.jest-cache --coverageReporters=text-summary --coverageReporters=lcov

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Verify build secrets are configured
        # Without these the failure surfaces as an opaque module-init throw
        # from supabase-client.ts, or a sitemap prerender error. Fail early
        # with a message that names the missing secret instead.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All required build secrets are present."

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        env:
          # Prerendered routes and sitemap.ts query Supabase at build time,
          # so these have to be real credentials rather than placeholders.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Baked into canonical URLs and the sitemap at build time.
          SITE_URL: ${{ vars.SITE_URL || 'https://hobbistas-hub.com' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://hobbistas-hub.com' }}
          #
          # Nothing else is listed on purpose. The three Supabase values are
          # the only env vars the build can fail without; every other
          # integration key is read lazily, so its absence just makes that
          # feature inert in an artifact that is never deployed.
        run: npm run build
