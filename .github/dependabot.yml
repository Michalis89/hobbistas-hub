# This file configures Dependabot *version updates* only - routine freshening of
# the lockfile, whether or not anything is vulnerable.
#
# It is not what fixes a security alert. That is *Dependabot security updates*,
# a toggle under Settings > Code security, and it was off while alerts were on -
# which is the actual reason 106 alerts had accumulated against zero pull
# requests. Turning it on is what makes a vulnerability arrive as a fix rather
# than as a notification. This file is the separate, optional habit on top.
#
# Version updates still earn their place here: every bump they propose already
# sits inside a range package.json declares, so a fresh `npm install` picks it
# up anyway. A stale lockfile just means CI tests something other than what a
# clean clone gets.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Monthly, not weekly. This is hygiene rather than news, and the first
    # weekly run alone produced five pull requests.
    schedule:
      interval: monthly
    # One pull request per group instead of per package. Ungrouped, this
    # dependency tree produces dozens at a time - the volume is exactly what
    # made the backlog easy to ignore - and a single lockfile-only pull request
    # per group is also the shape `npm audit fix` already produces.
    #
    # Production and development are kept apart because they carry different
    # risk: a transitive DoS in a jest transform is not the same news as one in
    # a request path.
    groups:
      production-minor-and-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'
    # Majors are not proposed at all. Letting them arrive one pull request each
    # sounded tidy and in practice meant tailwindcss 3 -> 4 and jest 29 -> 30
    # sitting open indefinitely: both need their migration guide worked through,
    # which is a decision to schedule, not a pull request to review. Raising a
    # major stays a deliberate act - and a major that matters for security still
    # reaches you through the alerts.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
  # The workflow actions pin major tags (actions/checkout@v7 and friends), so
  # there is little churn here; monthly is enough to catch a deprecation before
  # a runner drops the version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore
    labels:
      - DevOps
